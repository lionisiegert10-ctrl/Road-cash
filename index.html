<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Cash</title>
<meta name="theme-color" content="#14171f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Road Cash">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f2efe8;--panel:#fff;--ink:#1d2330;--muted:#5d6577;--accent:#e0a800;--line:#d6d1c4;--btn:#1d2330;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--panel:#1f2430;--ink:#eceff6;--muted:#9aa3b8;--accent:#ffc928;--line:#343b4d;--btn:#ffc928;--btnink:#14171f}}
:root[data-theme="dark"]{--bg:#14171f;--panel:#1f2430;--ink:#eceff6;--muted:#9aa3b8;--accent:#ffc928;--line:#343b4d;--btn:#ffc928;--btnink:#14171f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.money{font-size:28px;font-weight:700;color:var(--ink)}
.money small{font-size:13px;color:var(--muted);font-weight:400;display:block}
button{font:inherit;background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#wrap{position:relative;width:100%;max-width:440px;padding:0 12px}
canvas{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);touch-action:none}
#c{position:relative;z-index:2}
#c3{position:absolute;left:12px;top:0;width:calc(100% - 24px);height:100%;z-index:1;display:none}
.ctrl{display:flex;justify-content:space-between;gap:8px;width:100%;max-width:440px;padding:10px 12px}
.ctrl button{flex:1;font-size:22px;padding:16px 0;user-select:none;touch-action:none}
.hint{color:var(--muted);font-size:13px;padding:0 12px 8px;max-width:440px;text-align:center}
.shop{width:100%;max-width:440px;padding:0 12px 20px;display:grid;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card span{font-size:14px}.card b{display:block;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.box{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;width:100%;max-width:360px;max-height:90vh;overflow:auto;display:grid;gap:10px}
.box h2{margin:0;font-size:20px}
input[type=password],input[type=number]{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.err{color:#d33;font-size:13px;min-height:16px}
label{display:flex;align-items:center;gap:8px;font-size:14px}
#load{position:fixed;inset:0;z-index:50;background:#14171f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#load.out{opacity:0;pointer-events:none}
.lt{font-size:52px;font-weight:700;font-style:italic;letter-spacing:-2px;color:#ffc928;text-shadow:3px 3px 0 #d83a3a}
.road{position:relative;width:min(300px,80vw);height:70px;background:#3d4048;border-radius:8px;overflow:hidden}
.road:before{content:"";position:absolute;left:0;right:0;top:32px;height:6px;background:repeating-linear-gradient(90deg,#e8c84a 0 30px,transparent 30px 60px);animation:rd .4s linear infinite}
@keyframes rd{to{background-position:-60px 0}}
.lcar{position:absolute;left:50%;top:22px;width:56px;height:26px;margin-left:-28px;border-radius:8px 14px 6px 6px;background:#f2b705;animation:bump .25s ease-in-out infinite alternate}
.lcar:after{content:"";position:absolute;right:8px;top:4px;width:16px;height:9px;background:#1b2a3f;border-radius:3px}
.lcar:before{content:"";position:absolute;left:6px;bottom:-5px;width:12px;height:12px;border-radius:50%;background:#15171c;box-shadow:32px 0 #15171c}
@keyframes bump{to{transform:translateY(-2px)}}
.bar{width:min(300px,80vw);height:12px;background:#2c3242;border-radius:8px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc928,#ff7a2a)}
.ltip{color:#9aa3b8;font-size:14px;min-height:18px}
#ovMenu{background:var(--bg);align-items:flex-start;overflow:auto;padding:20px 12px}
.menu{width:100%;max-width:440px;display:grid;gap:10px}
.menu h1{margin:0;font-size:42px;letter-spacing:-1px}
.menu h2{margin:8px 0 0;font-size:18px}
.list{display:grid;gap:8px}
</style>
</head>
<body>
<div id="load"><div class="lt">Road Cash</div><div class="road"><i class="lcar"></i></div><div class="bar"><b id="lbar"></b></div><div class="ltip" id="ltip">Motoren werden gewärmt …</div></div>
<header>
  <div class="money"><span id="money">0 €</span><small id="info">0 km/h</small></div>
  <div class="row"><button class="alt" id="modeBtn" aria-label="2D oder 3D">3D</button><button class="alt" id="muteBtn" aria-label="Ton an oder aus">🔊</button><button class="alt" id="menuBtn">Garage</button><button class="alt" id="adminBtn">Admin</button></div>
</header>
<div id="wrap"><canvas id="c3" width="400" height="560"></canvas><canvas id="c" width="400" height="560"></canvas></div>
<div class="ctrl">
  <button id="bl" aria-label="Links">◀</button>
  <button id="bg" aria-label="Gas">Gas</button>
  <button id="bb" aria-label="Bremse">Bremse</button>
  <button id="bn" aria-label="Nitro" style="display:none">Nitro</button>
  <button id="br" aria-label="Rechts">▶</button>
</div>
<div class="hint">Pfeiltasten oder WASD zum Fahren. Sammle Münzen und weiche anderen Autos aus.</div>
<div class="ov on" id="ovMenu"><div class="menu">
  <h1>Road Cash</h1>
  <div class="money"><span id="mMoney">0 €</span><small>Kaufe Autos und Upgrades, dann fahr los.</small></div>
  <button id="play">Fahren</button>
  <button class="alt" id="modeBtn2">Ansicht: 2D</button>
  <div class="hint" id="mMsg" style="padding:0;min-height:16px"></div>
  <h2>Garage</h2><div class="list" id="garage"></div>
  <h2>Upgrades</h2><div class="list" id="shop"></div>
  <button class="alt" id="adminBtn2">Admin</button>
</div></div>

<div class="ov" id="ovLogin"><div class="box">
  <h2>Admin-Zugang</h2>
  <input type="password" id="code" placeholder="Code eingeben" inputmode="numeric" autocomplete="off">
  <div class="err" id="err"></div>
  <div class="row"><button id="login">Öffnen</button><button class="alt" id="cancel">Abbrechen</button></div>
</div></div>

<div class="ov" id="ovAdmin"><div class="box">
  <h2>Admin-Panel</h2>
  <div class="row"><button data-add="1000">+1.000 €</button><button data-add="100000">+100.000 €</button></div>
  <input type="number" id="setMoney" placeholder="Geld setzen">
  <button id="setBtn">Geld setzen</button>
  <label>Tempo-Faktor <input type="number" id="mult" min="0.5" max="5" step="0.5" value="1" style="width:80px"></label>
  <label><input type="checkbox" id="god"> Unverwundbar</label>
  <button id="chBtn">Dodge Challenger Hellcat freischalten</button>
  <div class="row"><select id="aCarSel" style="flex:1;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></select><button id="aCarBtn">Freischalten</button></div>
  <div class="row"><button class="alt" id="aAll">Alle Autos</button><button class="alt" id="aUp">Alle Upgrades</button><button class="alt" id="aFix">Alles reparieren</button><button class="alt" id="aCoin">Münzregen</button></div>
  <label>Verkehr <select id="aTraf" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><option value="0">Aus</option><option value=".5">Wenig</option><option value="1" selected>Normal</option><option value="2">Viel</option></select></label>
  <label><input type="checkbox" id="aInf"> Unendlich Geld</label>
  <label><input type="checkbox" id="aNit"> Nitro (Leertaste)</label>
  <div class="row"><button class="alt" id="reset">Spielstand löschen</button><button id="close">Schließen</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W=400,H=560;
var CARS=[
{id:'starter',name:'Kleinwagen',price:0,c:'#f2b705',spd:0,inc:0,type:0},
{id:'sport',name:'Sportwagen',price:2500,c:'#d83a3a',spd:40,inc:0.2,type:1},
{id:'suv',name:'Geländewagen',price:6000,c:'#2f7d5b',spd:20,inc:0.6,type:2},
{id:'super',name:'Supersportler',price:15000,c:'#7a4ce0',spd:90,inc:0.5,type:1},
{id:'gold',name:'Goldrenner',price:50000,c:'#e6b800',spd:140,inc:1.2,type:1},
{id:'challenger',name:'Dodge Challenger Hellcat (Admin)',price:0,c:'#c8102e',spd:260,inc:3,type:3,hidden:true},
{id:'police',name:'Polizei Interceptor (Admin)',price:0,c:'#f4f4f6',spd:120,inc:1,type:4,hidden:true},
{id:'monster',name:'Monstertruck (Admin)',price:0,c:'#2b6cd9',spd:60,inc:1.5,type:5,hidden:true},
{id:'tank',name:'Panzer (Admin)',price:0,c:'#5a6b3a',spd:80,inc:2,type:6,hidden:true},
{id:'lmp',name:'Le-Mans Rennwagen (Admin)',price:0,c:'#1b4fd1',spd:320,inc:2.5,type:7,hidden:true},
{id:'f1',name:'Formel 1 (Admin)',price:0,c:'#e10600',spd:380,inc:3,type:8,hidden:true}];
var S={money:0,motor:0,income:0,armor:0,accel:0,magnet:0,coin:0,dmg:{},owned:['starter'],car:'starter'};var brokenT=0,dist=0,deco=[],decoT=0;
try{var d=JSON.parse(localStorage.getItem('roadcash')||'null');if(d){S.money=+d.money||0;S.motor=+d.motor||0;S.income=+d.income||0;if(d.owned)S.owned=d.owned;if(d.car)S.car=d.car;['armor','accel','magnet','coin'].forEach(function(k){S[k]=+d[k]||0});if(d.dmg)S.dmg=d.dmg}}catch(e){}
function save(){try{localStorage.setItem('roadcash',JSON.stringify(S))}catch(e){}}
var admin={mult:1,god:false,nitro:false,inf:false,traffic:1};
var car={x:W/2,y:450,w:30,h:54},speed=0,off=0,traffic=[],coins=[],hit=0,keys={},toast='',toastT=0,spawnT=0,coinT=0,saveT=0;
var AC=null,eng=null,muted=false;
try{muted=localStorage.getItem('rc_mute')==='1'}catch(e){}
function audioInit(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    var o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),gn=AC.createGain();
    o1.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=500;gn.gain.value=0;
    o1.connect(f);o2.connect(f);f.connect(gn);gn.connect(AC.destination);
    eng={o1:o1,o2:o2,f:f,g:gn}}
  if(AC.state==='suspended')AC.resume();
}
function beep(fr,du,ty,vol,to){if(!AC||muted)return;var t=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+du);q.gain.setValueAtTime(vol||.15,t);q.gain.exponentialRampToValueAtTime(.001,t+du);o.connect(q);q.connect(AC.destination);o.start(t);o.stop(t+du)}
function noise(du,vol,fc){if(!AC||muted)return;var n=Math.floor(AC.sampleRate*du),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);var s=AC.createBufferSource(),f=AC.createBiquadFilter(),q=AC.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc||1200;q.gain.value=vol||.4;s.connect(f);f.connect(q);q.connect(AC.destination);s.start()}
function sfx(n){if(!AC||muted)return;
  if(n==='coin'){beep(880,.08,'square',.07);setTimeout(function(){beep(1320,.12,'square',.07)},70)}
  else if(n==='crash'){noise(.45,.6,900);beep(130,.3,'sawtooth',.2,40)}
  else if(n==='broken'){noise(1.2,.7,500);beep(220,.9,'sawtooth',.25,30)}
  else if(n==='buy'){beep(660,.1,'triangle',.15);setTimeout(function(){beep(990,.2,'triangle',.15)},90)}
  else if(n==='err'){beep(220,.22,'sawtooth',.1,150)}
  else if(n==='start'){beep(70,.7,'sawtooth',.14,300)}
  else if(n==='click'){beep(520,.04,'square',.04)}}
function engineUpdateOld(on){if(!eng||!AC)return;var v8=curCar().type==3,fr=Math.min(420,(v8?34:52)+speed*(v8?.55:.8)),t=AC.currentTime;
  eng.o1.frequency.setTargetAtTime(fr,t,.08);eng.o2.frequency.setTargetAtTime(fr*.5,t,.08);eng.f.frequency.setTargetAtTime(300+speed*4,t,.1);
  eng.g.gain.setTargetAtTime(on&&!muted&&brokenT<=0?.04+Math.min(.07,speed/6000):0,t,.1)}
function curCar(){for(var i=0;i<CARS.length;i++)if(CARS[i].id===S.car)return CARS[i];return CARS[0]}
function maxSpeed(){return (160+S.motor*25+curCar().spd)*admin.mult}
function rate(){return 1+S.income*0.4+curCar().inc}
function crashLimit(){return 5+S.armor}
function coinVal(){return 10+S.coin*3}
function repairCost(k){return k.price?Math.round(k.price*.3):0}
function view(k){var d=S.dmg[k.id]||0;return {c:k.c,type:k.type,dmg:d,broken:d>=crashLimit()}}
function UPGS(){return [['motor','Motor','Höchsttempo '+Math.round(maxSpeed())+' km/h'],['income','Einkommen','Verdienst ×'+rate().toFixed(1)],['armor','Panzerung','Hält '+crashLimit()+' Crashes aus'],['accel','Beschleunigung','Mehr Schub: +'+S.accel*10+' %'],['magnet','Münzmagnet','Reichweite '+(24+S.magnet*8)+' px'],['coin','Münzwert','Münze = '+coinVal()+' €']]}
var shopEl=document.getElementById('shop');
var BASE={motor:1500,income:2000,armor:3000,accel:1200,magnet:1500,coin:2500},MAXL={motor:30,income:30,armor:5,accel:10,magnet:5,coin:10};
function cost(k){return Math.round(BASE[k]*Math.pow(1.9,S[k]))}
function renderShop(){
  renderGarage();shopEl.innerHTML='';
  UPGS().forEach(function(u){
    var c=document.createElement('div');c.className='card';
    var s=document.createElement('span');var b=document.createElement('b');b.textContent=u[1]+' (Stufe '+S[u[0]]+')';
    s.appendChild(b);s.appendChild(document.createTextNode(u[2]));
    var bt=document.createElement('button');bt.textContent=S[u[0]]>=MAXL[u[0]]?'Maximal':'Kaufen: '+cost(u[0]).toLocaleString('de-DE')+' €';if(S[u[0]]>=MAXL[u[0]])bt.disabled=true;
    bt.onclick=function(){var p=cost(u[0]);if(S.money>=p){S.money-=p;S[u[0]]++;save();renderShop();say('Gekauft!')}else say('Nicht genug Geld')};
    c.appendChild(s);c.appendChild(bt);shopEl.appendChild(c);
  });
}
function say(t){toast=t;toastT=1.5;document.getElementById('mMsg').textContent=t;if(/Gekauft|Neues Auto|Repariert|freigeschaltet/.test(t))sfx('buy');else if(/Nicht genug|Dein Auto ist kaputt/.test(t))sfx('err')}
var cols=['#d94a4a','#3b82c4','#3aa06b','#8a5cc2','#e07b2a'];
function loop(t){
  var dt=Math.min(.05,(t-(loop.l||t))/1000);loop.l=t;
  if(menu){if(admin.inf&&S.money<1e9)S.money=1e9;engineUpdate(false);draw();document.getElementById('mMoney').textContent=Math.floor(S.money).toLocaleString('de-DE')+' €';requestAnimationFrame(loop);return}
  var up=keys.up,dn=keys.down,lf=keys.left,rt=keys.right;
  var mx=maxSpeed()*(admin.nitro&&keys.nitro?1.6:1);if(admin.nitro&&keys.nitro)speed+=220*dt;
  if(up)speed+=70*(1+S.accel*.1)*dt;else speed-=18*dt;
  if(dn)speed-=140*dt;
  if(car.x<62||car.x>W-62)speed-=110*dt;
  speed=Math.max(0,Math.min(mx,speed));if(brokenT>0)speed=0;
  var steer=(lf?-1:0)+(rt?1:0);
  car.x+=steer*(80+speed*0.9)*dt*(speed>0?1:0);
  car.x=Math.max(30,Math.min(W-30,car.x));
  var px=speed*2.6;off=(off+px*dt)%60;dist+=px*dt;decoT-=px*dt;if(decoT<=0){decoT=70+Math.random()*90;deco.push(mkDeco(mode3d?-500:-30))}deco.forEach(function(o){o.y+=px*dt});deco=deco.filter(function(o){return o.y<H+40});
  if(hit>0)hit-=dt;if(brokenT>0){brokenT-=dt;if(brokenT<=0){brokenT=0;openMenu()}}
  spawnT-=dt;if(spawnT<=0){spawnT=(.7+Math.random()*1.1)/Math.max(.25,admin.traffic);var cx=70+Math.random()*(W-140),v=(60+Math.random()*60)*2.6;if(admin.traffic>0)traffic.push({x:cx,y:mode3d?-480:-80,v:v,c:cols[Math.random()*cols.length|0],type:Math.random()*3|0})}
  coinT-=dt;if(coinT<=0){coinT=1.2+Math.random()*1.5;coins.push({x:70+Math.random()*(W-140),y:mode3d?-420:-20})}
  traffic.forEach(function(o){o.y+=(px-o.v)*dt});
  coins.forEach(function(o){o.y+=px*dt});
  traffic=traffic.filter(function(o){return o.y<H+120&&o.y>-700});
  coins=coins.filter(function(o){return o.y<H+40});
  if(hit<=0&&brokenT<=0&&!admin.god)traffic.forEach(function(o){if(Math.abs(o.x-car.x)<28&&Math.abs(o.y-car.y)<52){hit=1;speed=0;var l=Math.min(S.money,100);S.money-=l;sfx('crash');if(crashed()){sfx('broken');return}say('Crash! −'+l+' €')}});
  coins=coins.filter(function(o){if(Math.abs(o.x-car.x)<24+S.magnet*8&&Math.abs(o.y-car.y)<36+S.magnet*8){S.money+=Math.round(coinVal()*rate());sfx('coin');return false}return true});
  S.money+=speed/45*rate()*dt;if(admin.inf&&S.money<1e9)S.money=1e9;
  saveT+=dt;if(saveT>3){saveT=0;save()}
  if(toastT>0)toastT-=dt;engineUpdate(true);
  draw();
  document.getElementById('money').textContent=Math.floor(S.money).toLocaleString('de-DE')+' €';
  document.getElementById('info').textContent=Math.round(speed)+' km/h · Schaden '+(S.dmg[S.car]||0)+'/'+crashLimit();
  requestAnimationFrame(loop);
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawCar(g,x,y,k,fl){
  var t=k.type||0,dm=k.dmg||0,br=k.broken;if(br){g.save();g.translate(x,y);g.rotate(.12);g.translate(-x,-y)}
  if(t===8){f1(g,x,y,fl,k.c,dm,br);if(br)g.restore();return}
  g.fillStyle='rgba(0,0,0,.28)';rr(g,x-13,y-23,32,56,8);g.fill();
  g.fillStyle='#15171c';
  [-20,10].forEach(function(dy){g.fillRect(x-18,y+dy,6,13);g.fillRect(x+12,y+dy,6,13)});
  rr(g,x-15,y-27,30,54,t==1?11:7);g.fillStyle=fl?'#fff':k.c;g.fill();
  var gr=g.createLinearGradient(x-15,0,x+15,0);
  gr.addColorStop(0,'rgba(255,255,255,.4)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');
  g.fillStyle=gr;g.fill();
  if(t==1&&!fl){g.fillStyle='rgba(255,255,255,.85)';g.fillRect(x-2,y-27,4,54)}
  g.fillStyle='#1b2a3f';rr(g,x-11,y-16,22,11,3);g.fill();rr(g,x-10,y+8,20,8,3);g.fill();
  g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x-8,y-15,6,3);
  g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x-11,y-5,22,13);

document.getElementById('chBtn').onclick=function(){if(S.owned.indexOf('challenger')<0)S.owned.push('challenger');S.car='challenger';S.dmg.challenger=0;save();renderShop();say('Dodge Challenger freigeschaltet!')};
addEventListener('pointerdown',audioInit);
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(b&&!b.closest('.ctrl'))sfx('click')});
var mb=document.getElementById('muteBtn');mb.textContent=muted?'🔇':'🔊';
mb.onclick=function(){muted=!muted;mb.textContent=muted?'🔇':'🔊';try{localStorage.setItem('rc_mute',muted?'1':'0')}catch(e){}};
var asp=document.createElement('canvas');asp.width=W-80;asp.height=120;
(function(){var a=asp.getContext('2d');a.fillStyle='#3a3d44';a.fillRect(0,0,asp.width,120);
  for(var i=0;i<900;i++){a.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.12)';a.fillRect(Math.random()*asp.width,Math.random()*120,1+Math.random()*2,1+Math.random()*2)}
  a.fillStyle='rgba(0,0,0,.18)';a.fillRect(70,0,18,120);a.fillRect(asp.width-88,0,18,120);
  a.strokeStyle='rgba(0,0,0,.35)';a.lineWidth=1;a.beginPath();a.moveTo(30,0);a.lineTo(38,50);a.lineTo(30,120);a.stroke()})();
function $(i){return document.getElementById(i)}
var cs=$('aCarSel');CARS.forEach(function(k){if(k.hidden){var op=document.createElement('option');op.value=k.id;op.textContent=k.name.replace(' (Admin)','');cs.appendChild(op)}});
$('aCarBtn').onclick=function(){var id=cs.value;if(S.owned.indexOf(id)<0)S.owned.push(id);S.car=id;S.dmg[id]=0;save();renderShop();say('Fahrzeug freigeschaltet!')};
$('aAll').onclick=function(){S.owned=CARS.map(function(k){return k.id});save();renderShop();say('Alle Autos freigeschaltet!')};
$('aUp').onclick=function(){['motor','income','armor','accel','magnet','coin'].forEach(function(k){S[k]=Math.max(S[k],Math.min(MAXL[k],10))});save();renderShop();say('Upgrades gesetzt!')};
$('aFix').onclick=function(){S.dmg={};brokenT=0;save();renderShop();say('Repariert!')};
$('aCoin').onclick=function(){for(var i=0;i<15;i++)coins.push({x:70+Math.random()*(W-140),y:-20-i*40})};
$('aTraf').onchange=function(){admin.traffic=parseFloat(this.value)};
$('aInf').onchange=function(){admin.inf=this.checked};
$('aNit').onchange=function(){admin.nitro=this.checked;$('bn').style.display=this.checked?'':'none'};
function uiMode(){$('c3').style.display=mode3d?'block':'none';$('modeBtn').textContent=mode3d?'2D':'3D';$('modeBtn2').textContent='Ansicht: '+(mode3d?'3D':'2D')}
function setMode(){mode3d=!mode3d;try{localStorage.setItem('rc_3d',mode3d?'1':'0')}catch(e){}uiMode()}
$('modeBtn').onclick=setMode;$('modeBtn2').onclick=setMode;uiMode();
for(var di=0;di<14;di++)deco.push(mkDeco(Math.random()*H));
renderShop();requestAnimationFrame(loop);
var lp=0,tips=['Motoren werden gewärmt …','Reifen werden aufgepumpt …','Münzen werden gezählt …','Straße wird geteert …'];
var li=setInterval(function(){lp=Math.min(100,lp+4+Math.random()*7);document.getElementById('lbar').style.width=lp+'%';document.getElementById('ltip').textContent=tips[Math.min(3,lp/25|0)];if(lp>=100){clearInterval(li);setTimeout(function(){document.getElementById('load').classList.add('out')},250)}},120);
})();
</script>
